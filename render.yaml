services:
  - type: web
    name: orbit-studymate-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: UPLOAD_DIR
        value: "uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"

databases:
  - name: orbit-db
    databaseName: orbit
    user: orbit_user
    plan: free

